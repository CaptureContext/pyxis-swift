name: PyxisExample
options:
  bundleIdPrefix: dev.pyxis.example
  deploymentTarget:
    iOS: '17.0'
packages:
  Example:
    path: .
    excludeFromProject: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    DEVELOPMENT_TEAM: ''
    CODE_SIGNING_ALLOWED: NO
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: NO
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  PyxisExample:
    type: application
    platform: iOS
    sources: [App]
    info:
      path: App/Info.plist
      properties:
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
    dependencies:
      - package: Example
        product: ExampleApp
  PyxisRuntimeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [../Tests/PyxisRuntimeTests]
    settings:
      base:
        OTHER_SWIFT_FLAGS: '$(inherited) -package-name pyxis_swift'
    dependencies:
      - target: PyxisExample
  PyxisExampleUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: PyxisExample
      - package: Example
        product: ExampleTesting
schemes:
  PyxisExample:
    build:
      targets:
        PyxisExample: all
        PyxisExampleUITests: [test]
        PyxisRuntimeTests: [test]
    test:
      targets: [PyxisExampleUITests, PyxisRuntimeTests]
      gatherCoverageData: false
