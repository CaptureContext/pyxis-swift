version: 1
xcode:
  workspace: PyxisExample.xcworkspace
  scheme: PyxisExample
  only_testing: [PyxisExampleSnapshotTests/ExampleSnapshots]
  build_arguments: [CODE_SIGNING_ALLOWED=NO, -skipMacroValidation, -skipPackagePluginValidation]
  test_arguments: [-testLanguage, en, -testRegion, US]
devices:
  - name: iPhone 18 Pro
variants:
  color_scheme: [dark, light]
  layout_direction: [ltr, rtl]
  accessibility.content_size: [large, xxx_large]
  subscription.status: [trial]
output: ../.generated/snapshot-recordings
storage:
  path: ../.generated/ExampleRecordingStore
  context: example
  policy: merge
derived_data: ../.generated/ExampleDerivedData
images:
  width: 240
  jpeg_quality: 0.5
